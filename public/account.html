<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730"><link rel="icon" href="/favicon.svg"><title>Minha conta | Radar de Leads Locais</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17233c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:28px;box-shadow:0 18px 55px #10254b12}.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#7695ff,#3862ed);color:white;display:grid;place-items:center;font-size:22px}.brand strong{display:block}.brand small{color:#8491a7}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.3px;color:#4268f5}.card h1{font-size:24px;margin:6px 0}.muted{color:#71809c;font-size:13px;line-height:1.6}.identity{padding:14px;border:1px solid #e5eaf2;border-radius:10px;background:#f8f9fc;margin:20px 0}.identity small{display:block;color:#8491a7;font-size:10px;margin-bottom:4px}.identity strong{overflow-wrap:anywhere}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{min-height:42px;padding:0 14px;border:1px solid #dce3ed;border-radius:9px;background:white;color:#40516d;font:inherit;font-size:12px;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn-primary{background:#4268f5;color:#fff;border-color:#4268f5}.btn-danger{color:#a9433f;border-color:#efcfcd}.btn:disabled{opacity:.6;cursor:wait}.status{min-height:18px;margin-top:12px;font-size:12px;color:#a9433f}.footer{margin-top:22px;text-align:center;font-size:10px;color:#71809c}.footer a{color:#3458d4}
</style></head>
<body><main class="card"><div class="brand"><div class="mark">⌖</div><div><strong>Radar de Leads Locais</strong><small>Configurações da conta</small></div></div><div class="eyebrow">MINHA CONTA</div><h1>Conta e sessão</h1><p class="muted">Confira qual conta está conectada ou encerre a sessão neste dispositivo.</p><div class="identity"><small>Conectado como</small><strong id="email">Verificando…</strong></div><div class="identity"><small>Plano ativo</small><strong id="plan">Conferindo…</strong></div><div class="actions"><a class="btn btn-primary" href="/radar.html">Voltar à busca</a><button class="btn btn-danger" id="logoutBtn" type="button">Sair da conta</button></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="footer">O acesso neste dispositivo termina ao sair da conta. <a href="/terms">Termos de uso</a> · <a href="/privacy">Privacidade</a></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.authenticated){location.replace('/login.html?next=%2Faccount.html');return}$('email').textContent=d.user.email;$('plan').textContent=({essential:'Essencial',pro:'Pro',premium:'Premium'})[d.plan]||'Indisponível'}).catch(()=>location.replace('/login.html?next=%2Faccount.html'));$('logoutBtn').onclick=async()=>{const b=$('logoutBtn');b.disabled=true;b.textContent='Saindo…';$('status').textContent='';try{const r=await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Não foi possível encerrar a sessão.');location.replace('/login.html?signedOut=1')}catch(e){b.disabled=false;b.textContent='Sair da conta';$('status').textContent=e instanceof Error?e.message:'Não foi possível encerrar a sessão.'}}})();</script><script defer src="/alegon-navigation.js"></script></body></html>
